# ============================================================
#  Ghostty · perfil para transmisiones en vivo
#  Se carga encima de ~/.config/ghostty/config, así que solo cambia
#  lo que el video necesita. Lanzar con:
#    ghostty --gtk-single-instance=false --config-file=~/.config/ghostty/stream.conf
# ============================================================

# ---------- Texto grande y con cuerpo ----------
# A 1080p, el texto fino se "derrite" con la compresión.
# Objetivo: que no quepan más de ~40 líneas y ~110 columnas.
font-size = 18
# JetBrainsMono Nerd Font solo trae Regular/Bold: pedir Medium o ExtraBold
# hace que el negrita caiga a Regular. Se heredan font-style y el bold real.

# Algo más de aire entre líneas para que el video no las empaste
adjust-cell-height = 15%

# ---------- Sin transparencia ----------
# El fondo detrás del texto ensucia la imagen y gasta bitrate
background-opacity = 1

# ---------- Colores pensados para video ----------
# Paleta de marca de mi canal de YouTube.
# La compresión reduce la resolución del color a la mitad, pero
# conserva el brillo: todos los colores de texto superan 5:1 de
# contraste sobre el fondo, así se leen por luminosidad y no por tono.
background = #0D0F12
foreground = #E6E6E0

# Los grises, el ámbar y el hielo son de la paleta tal cual. El rojo se
# aclara (rojoApagado #B4554B da solo 4:1). Azul y magenta no existen en
# la paleta: son tonos derivados, tranquilos para no competir con el ámbar.
palette = 0=#13161B
palette = 1=#E2776B
palette = 2=#7FA88A
palette = 3=#FFB13D
palette = 4=#7FA8FF
palette = 5=#C3A3E8
palette = 6=#7FD6FF
palette = 7=#B8BCC4
palette = 8=#8A8F98
palette = 9=#F09A8F
palette = 10=#A9D6B3
palette = 11=#FFCB7A
palette = 12=#A6C4FF
palette = 13=#D8C0F2
palette = 14=#A8E5FF
palette = 15=#E6E6E0

# Selección más evidente: el público tiene que ver qué señalas.
# Ámbar oscuro de la marca con texto hueso (8.8:1).
selection-background = #4A3A1C
selection-foreground = #E6E6E0

# Contraste mínimo más alto que en el día a día
minimum-contrast = 5

# ---------- Espacio para overlays ----------
# Margen generoso para la webcam o el chat sin tapar texto
window-padding-x = 24
window-padding-y = 20

# ---------- Foco evidente ----------
# El split activo se distingue mucho más del inactivo
unfocused-split-opacity = 0.7
split-divider-color = #8A8F98

# Cursor: bloque fijo (de config), en ámbar para que se vea en cámara
cursor-color = #FFB13D
cursor-text = #0D0F12

# Ventana con su propia clase para reglas de Hyprland
class = com.imontes.stream

# ---------- Pegar con Ctrl+V ----------
# Por defecto Ghostty en Linux pega con Ctrl+Shift+V. Ctrl+V pega también.
# Ojo: en TUIs que usan Ctrl+V (bloque visual en vim) pega en vez de pasar la tecla.
keybind = ctrl+v=paste_from_clipboard
