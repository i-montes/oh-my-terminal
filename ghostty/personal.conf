# ============================================================
#  Ghostty · perfil personal (uso diario)
#  Se carga después del tema de Omarchy, así que la paleta y el
#  tamaño de letra se mantienen aunque cambies de tema.
#  Paleta de marca de mi canal de YouTube
# ============================================================

# ---------- Letra ----------
# 8 era muy pequeño: en esta pantalla (1080p, escala 1.25) 12 deja
# ~90 columnas × 47 filas en media pantalla.
font-size = 12
adjust-cell-height = 8%

# ---------- Colores ----------
background = #0D0F12
foreground = #E6E6E0

palette = 0=#13161B
palette = 1=#E2776B
palette = 2=#7FA88A
palette = 3=#FFB13D
palette = 4=#7FA8FF
palette = 5=#C3A3E8
palette = 6=#7FD6FF
palette = 7=#B8BCC4
palette = 8=#8A8F98
palette = 9=#F09A8F
palette = 10=#A9D6B3
palette = 11=#FFCB7A
palette = 12=#A6C4FF
palette = 13=#D8C0F2
palette = 14=#A8E5FF
palette = 15=#E6E6E0

# Cursor ámbar, selección ámbar oscuro
cursor-color = #FFB13D
cursor-text = #0D0F12
selection-background = #4A3A1C
selection-foreground = #E6E6E0

# Evita texto ilegible si una app pide un color muy oscuro
minimum-contrast = 3

# ---------- Ventana ----------
window-padding-x = 18
window-padding-y = 14

# Splits: el inactivo se atenúa un poco y el divisor se ve
unfocused-split-opacity = 0.85
split-divider-color = #2A2E35

# ---------- Tabs ----------
# Compactos y discretos: sin ocupar todo el ancho, con el activo marcado
# por una línea ámbar. Estilos en tabs.css. La barra se oculta con un solo tab.
gtk-wide-tabs = false
gtk-custom-css = "~/.config/ghostty/tabs.css"
